name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frozen-values:
    name: frozen values (fast signal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install pinned environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r code/requirements.lock

      - name: Record numerical environment
        run: python .github/scripts/report_env.py

      - name: Frozen-value regression tests
        run: python -m pytest code/tests/test_freeze.py -q

  full-suite:
    name: full suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install pinned environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r code/requirements.lock

      - name: Record numerical environment
        run: python .github/scripts/report_env.py

      - name: Full test suite
        run: python -m pytest code/ -q
