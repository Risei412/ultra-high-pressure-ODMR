# Fully pinned environment for reproducible runs of this repository.
#
# These are the exact versions in which the full suite (243 tests) is green,
# measured 2026-09-19 on Python 3.14.7. `requirements.txt` keeps the loose
# lower bounds for casual use; this file is what CI installs and what any
# reproducibility claim about this repository refers to.
#
#   python -m pip install -r code/requirements.lock
#   python -m pytest code/
#
# Regenerate with:
#   python -m pip freeze
# and re-run the full suite before committing a change here.

